{% extends 'base.html' %}

{% block title %}Patient Form{% endblock %}

{% block content %}
    <h1 class="mb-3">Patient Form</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Save</button>
                <a href="{% url 'patient_list' %}" class="btn btn-outline-secondary">Back to list</a>
            </form>
        </div>
    </div>
{% endblock %}
