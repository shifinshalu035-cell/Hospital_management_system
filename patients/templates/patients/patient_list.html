{% extends 'base.html' %}

{% block title %}Patients{% endblock %}

{% block content %}
    <h1 class="mb-3">Patient List</h1>

    <form method="get" class="row g-2 mb-3">
        <div class="col-md-6">
            <input type="text" name="q" class="form-control"
                   placeholder="Search patient by name" value="{{ query }}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Search</button>
            <a href="{% url 'patient_list' %}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <a href="{% url 'patient_add' %}" class="btn btn-success mb-3">+ Add Patient</a>

    <table class="table table-striped table-bordered bg-white align-middle">
        <thead class="table-primary">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for p in patients %}
            <tr>
                <td><a href="{% url 'patient_detail' p.id %}">{{ p.name }}</a></td>
                <td>{{ p.age }}</td>
                <td>{{ p.gender }}</td>
                <td>{{ p.phone }}</td>
                <td>
                    <a href="{% url 'patient_edit' p.id %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'patient_delete' p.id %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center text-muted">No patients found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
