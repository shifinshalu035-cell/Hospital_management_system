{% extends 'base.html' %}

{% block title %}Patients{% endblock %}

{% block content %}
    <h1>Patient List</h1>
    <form method="get">
    <input type="text" name="q" placeholder="Search patient by name" value="{{ query }}">
    <button type="submit">Search</button>
    <a href="{% url 'patient_list' %}">Clear</a>
    </form>
    <a href="{% url 'patient_add' %}">+ Add Patient</a>
    <table border="1">
        <tr>
            <th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Actions</th>
        </tr>
        {% for p in patients %}
        <tr>
            <td><a href="{% url 'patient_detail' p.id %}">{{ p.name }}</a></td>
            <td>{{ p.age }}</td>
            <td>{{ p.gender }}</td>
            <td>{{ p.phone }}</td>
            <td>
                <a href="{% url 'patient_edit' p.id %}">Edit</a> |
                <a href="{% url 'patient_delete' p.id %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
