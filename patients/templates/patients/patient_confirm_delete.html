{% extends 'base.html' %}

{% block title %}Delete Patient{% endblock %}

{% block content %}
    <h1>Delete {{ patient.name }}?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>
    <a href="{% url 'patient_list' %}">Cancel</a>
{% endblock %}
