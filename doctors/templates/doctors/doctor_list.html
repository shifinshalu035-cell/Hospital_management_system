<!DOCTYPE html>
<html>
<head><title>Doctors</title></head>
<body>
    <h1>Doctor List</h1>
    <a href="{% url 'doctor_add' %}">+ Add Doctor</a>
    <table border="1">
        <tr>
            <th>Name</th><th>Specialization</th><th>Phone</th><th>Available</th><th>Actions</th>
        </tr>
        {% for d in doctors %}
        <tr>
            <td>{{ d.name }}</td>
            <td>{{ d.specialization }}</td>
            <td>{{ d.phone }}</td>
            <td>{{ d.available|yesno:"Yes,No" }}</td>
            <td>
                <a href="{% url 'doctor_edit' d.id %}">Edit</a> |
                <a href="{% url 'doctor_delete' d.id %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
