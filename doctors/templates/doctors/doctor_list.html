{% extends 'base.html' %}

{% block title %}Doctors{% endblock %}

{% block content %}
    <h1>Doctor List</h1>
   <a href="{% url 'patient_add' %}" class="btn btn-primary mb-3">+ Add Doctor</a>
   <table class="table table-striped table-bordered bg-white">
        <tr>
            <th>Name</th><th>Specialization</th><th>Phone</th><th>Available</th><th>Actions</th>
        </tr>
        {% for d in doctors %}
        <tr>
            <td>{{ d.name }}</td>
            <td>{{ d.specialization }}</td>
            <td>{{ d.phone }}</td>
            <td>{{ d.available|yesno:"Yes,No" }}</td>
            <td>
                <a href="{% url 'patient_edit' p.id %}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{% url 'patient_delete' p.id %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
