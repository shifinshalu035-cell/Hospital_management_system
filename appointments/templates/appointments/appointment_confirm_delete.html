{% extends 'base.html' %}

{% block title %}Delete Appointment{% endblock %}

{% block content %}
    <h1>Delete appointment for {{ appointment.patient.name }}?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Yes, delete</button>
    </form>
    <a href="{% url 'appointment_list' %}">Cancel</a>
{% endblock %}
