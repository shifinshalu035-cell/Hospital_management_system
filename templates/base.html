<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HMS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">HMS</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="{% url 'patient_list' %}">Patients</a>
                <a class="nav-link" href="{% url 'doctor_list' %}">Doctors</a>
                <a class="nav-link" href="{% url 'appointment_list' %}">Appointments</a>
                <a class="nav-link" href="{% url 'about' %}">About</a>
            </div>
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="text-white me-3">Hi, {{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-light btn-sm">Logout</button>
                    </form>
                {% else %}
                    <a class="btn btn-light btn-sm" href="{% url 'login' %}">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
