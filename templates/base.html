<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HMS{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
        nav { background: #0d6efd; padding: 14px 24px; }
        nav a { color: white; text-decoration: none; margin-right: 18px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1000px; margin: 24px auto; padding: 0 20px; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #e9eef5; }
        .cards { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 24px; }
        .card { flex: 1; min-width: 220px; background: white; padding: 20px;
                border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
        .card h2 { margin-top: 0; color: #0d6efd; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="{% url 'patient_list' %}">Patients</a>
        <a href="{% url 'doctor_list' %}">Doctors</a>
        <a href="{% url 'appointment_list' %}">Appointments</a>
        <a href="{% url 'about' %}">About</a>
        {% if user.is_authenticated %}
    <span style="color:white; margin-right:10px;">Hi, {{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
{% else %}
    <a href="{% url 'login' %}">Login</a>
{% endif %}
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
